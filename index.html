<html lang="pt-BR"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#060d0b;--sf:#0f1c18;--sf2:#14261f;--tx:#efe9d8;--mu:#8ea49a;--ln:#1f342c;--gd:#d4af5f;--gd2:#f0d58b;--pos:#4fc08b;--neg:#e3806f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2eee2;--sf:#fffdf6;--sf2:#f6f1e1;--tx:#14261f;--mu:#66756d;--ln:#ddd5bf;--gd:#9c7623;--pos:#17744f;--neg:#a43b2b;color-scheme:light}}
:root[data-theme="light"]{--bg:#f2eee2;--sf:#fffdf6;--sf2:#f6f1e1;--tx:#14261f;--mu:#66756d;--ln:#ddd5bf;--gd:#9c7623;--pos:#17744f;--neg:#a43b2b;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px Manrope,"Segoe UI",Arial,sans-serif;max-width:480px;margin:auto;min-height:100vh;padding-bottom:86px}
body.lk #app{filter:blur(18px);pointer-events:none}
h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
h3{font-size:22px;margin:0 0 10px}
main{padding:14px 18px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bar{display:flex;align-items:center;gap:12px;padding:16px 18px 4px}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#f4ecd4;font-weight:700;font-size:13px;flex:none;border:1px solid var(--gd)}
.ib{background:var(--sf);border:1px solid var(--ln);border-radius:50%;width:40px;height:40px;padding:0;display:grid;place-items:center;color:var(--tx);position:relative}
.ib b{position:absolute;top:-3px;right:-3px;background:var(--gd);color:#201705;border-radius:9px;font-size:10px;padding:1px 5px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tier{font-size:11px;color:var(--gd);border:1px solid var(--gd);border-radius:10px;padding:1px 8px}
.hero{margin:12px 18px;padding:20px;border-radius:18px;background:radial-gradient(120% 120% at 100% 0,#16705a,#0a3d31 50%,#06231c);border:1px solid #d4af5f55;color:#f4ecd4}
.bal{font:600 40px/1.1 "Cormorant Garamond",Georgia,serif;display:flex;align-items:center;gap:10px;margin:4px 0}
.hero small,.sub{color:#b9c9bf;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 18px}
.grid button{background:none;color:var(--tx);font-weight:500;font-size:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:12px}
.grid button span{width:52px;height:52px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center;color:var(--gd)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}.item small{color:var(--mu);display:block;font-size:12px}.l{display:flex;align-items:center;gap:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
button{font:700 14px Manrope,sans-serif;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;background:linear-gradient(135deg,var(--gd),var(--gd2));color:#201705}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--gd)}button.lnk{background:none;color:var(--gd);padding:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gd2);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);margin:4px 0 14px}
label{font-size:12px;color:var(--mu)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);font-weight:500;font-size:11px;padding:10px 0 9px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--gd);font-weight:700}
.cc{perspective:1000px;height:204px;margin:4px 0 14px;cursor:pointer;touch-action:pan-y}
.cc>div{position:relative;height:100%;transition:transform .7s;transform-style:preserve-3d}.cc.f>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#e9dcb4;overflow:hidden;box-shadow:0 16px 34px #000a;border:1px solid #d4af5f55}
.front{background:var(--cg,linear-gradient(135deg,#232323,#050505 45%,#1b1b1b));padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
.front:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,75%) var(--my,0%),#ffffff2e,transparent 55%)}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,#1c1c1c,#050505)}
.front>*{position:relative}
.amex{border:1.5px solid #e9dcb4;padding:3px 6px;font:700 9px/1.15 Manrope,sans-serif;letter-spacing:1px;text-align:center}
.chip{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f0d58b,#8d6a22)}
.num{font:500 21px "Cormorant Garamond",Georgia,serif;letter-spacing:2.5px}
.stripe{height:40px;background:#000;margin-top:22px}
.sig{margin:16px;height:34px;background:repeating-linear-gradient(45deg,#e9dcb4,#e9dcb4 6px,#d9c993 6px,#d9c993 12px);color:#222;font:italic 12px Georgia,serif;padding:9px}
.price{font:600 28px "Cormorant Garamond",Georgia,serif}
svg.ch{width:100%;height:64px;display:block}
.bar2{height:6px;border-radius:3px;background:var(--ln);overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),var(--gd2))}
.ov{position:fixed;inset:0;display:none;z-index:20;align-items:center;justify-content:center;padding:20px;flex-direction:column}.ov.on{display:flex}
#modal{background:#000b}.box{background:var(--sf);border:1px solid var(--gd);border-radius:18px;padding:20px;width:100%;max-width:360px}
#pin{background:var(--bg);z-index:30}.dots{display:flex;gap:14px;justify-content:center;margin:14px 0 22px}.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gd)}.dots i.f{background:var(--gd)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}.pad button{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:50%;width:76px;height:76px;padding:0;font-size:24px;font-family:"Cormorant Garamond",Georgia,serif}
#nfc{background:#000d;color:#f4ecd4;text-align:center}
.fl{width:300px;animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-18px) rotate(-1.5deg)}}
.rg{position:relative;width:90px;height:90px;margin:34px auto 12px}.rg i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gd);animation:rg 1.8s infinite}.rg i:nth-child(2){animation-delay:.6s}@keyframes rg{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
#splash{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;transition:opacity .6s}#splash.x{opacity:0;pointer-events:none}#splash svg{animation:sp 1.2s ease-in-out infinite alternate}@keyframes sp{to{transform:scale(1.12)}}
#toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:var(--sf2);color:var(--tx);border:1px solid var(--gd);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50;max-width:90%;text-align:center}#toast.on{opacity:1}
.me{background:#d4af5f1c;margin:0 -10px;padding:12px 10px;border-radius:10px}.rk{font:600 26px "Cormorant Garamond",Georgia,serif;color:var(--gd);width:26px}
.ct{display:flex;gap:12px;overflow-x:auto;padding:4px 0 12px}.ct button{background:none;color:var(--tx);font-size:12px;font-weight:500;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:68px;border:1px solid transparent}.ct button.s{border-color:var(--gd);background:var(--sf)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.empty{color:var(--mu)}body{font-variant-numeric:tabular-nums}.bar2 i{transition:width .8s ease}.cf{position:fixed;top:-14px;width:8px;height:12px;z-index:60;pointer-events:none;animation:cf 2.4s linear forwards}@keyframes cf{to{transform:translateY(108vh) rotate(720deg)}}.front:after{content:"";position:absolute;right:22px;top:78px;width:34px;height:26px;border-radius:5px;background:conic-gradient(from 40deg,#7ee,#e7f,#fe7,#7ef,#7ee);opacity:.45}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body class="lk">
<div id="app"></div><div id="toast"></div><div id="modal" class="ov"></div><div id="nfc" class="ov"></div><div id="pin" class="ov"></div>
<div id="splash"><svg id="sl" width="96" height="96" viewBox="0 0 100 100"></svg></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const P={pix:'M12 3l9 9-9 9-9-9zM9 12l3-3 3 3',card:'M3 6h18v12H3zM3 10h18M6 15h4',inv:'M3 17l6-6 4 4 8-8M15 7h6v6',ext:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',rank:'M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3',loan:'M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6',nfc:'M6 8a8 8 0 010 8M10 6a12 12 0 010 12M14 4a16 16 0 010 16',bell:'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6',home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',fat:'M5 4h14v16l-3-2-4 2-4-2-3 2zM9 9h6M9 13h4',cx:'M4 10h16v10H4zM8 10V7a4 4 0 018 0v3',vaq:'M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z',cob:'M4 4h16v13H8l-4 4zM8 9h8M8 13h5',feed:'M3 12h4l3-8 4 16 3-8h4',rel:'M5 20V10M12 20V4M19 20v-7',ia:'M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.500 9.500l4.700-1.800zM18 16l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z',shop:'M4 8h16l-1 12H5zM8 8a4 4 0 018 0',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;
const FUNDS=[{id:'BRHM',nome:'Fundo Brahma Gelada',sub:'Fundo imobiliário de latinhas · BRHM11',p:42.5,vol:.06},{id:'CAML',nome:'Camel Capital',sub:'Fundo de fumaça e lucro · CAML3',p:18.9,vol:.08},{id:'DUZL',nome:'Duzão Lanches',sub:'Fundo de lanches e lucro · DUZL3',p:27.4,vol:.07},{id:'RAVN',nome:'As Visões da Raven',sub:'Fundo de premonições · RAVN11',p:33,vol:.09}];
const TIERS=[['Gold',0],['Platinum',3000],['Centurion',10000]];
let db,uid,accs=[],pixs=[],mkt={},tab='home',flip=false,state='load',unl=false,wel=true,pinOpen=false,hide=false,pick='',known=null,rcpt='',vaqs=[],dons=[],cobs=[];
const rnd=n=>Array.from({length:n},()=>Math.floor(Math.random()*10)).join('');
const price=id=>mkt[id]||FUNDS.find(f=>f.id===id).p;
const recv=id=>pixs.filter(x=>x.to===id).reduce((a,x)=>a+x.v,0),sent=id=>pixs.filter(x=>x.from===id).reduce((a,x)=>a+x.v,0);
const don=id=>dons.filter(x=>x.from===id).reduce((a,x)=>a+x.v,0);const bal=a=>a.saldo+recv(a.id)-sent(a.id)-don(a.id);
const inv=a=>FUNDS.reduce((s,f)=>s+((a.hold||{})[f.id]||0)*price(f.id),0);
const cxs=a=>(a.cx||[]).reduce((s,c)=>s+c.val,0);const patr=a=>bal(a)+inv(a)+cxs(a),me=()=>accs.find(a=>a.id===uid);
const tier=p=>{let t=0;TIERS.forEach((x,i)=>{if(p>=x[1])t=i});return t};
const av=(n,s=40)=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `<span class="av" style="width:${s}px;height:${s}px;background:hsl(${h} 38% 26%)">${esc(n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`};
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="lg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fbeaa8"/><stop offset=".55" stop-color="#d4af5f"/><stop offset="1" stop-color="#8d6a22"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="url(#lg)"/><circle cx="50" cy="50" r="40" fill="none" stroke="#7a5a1a" stroke-width="1.6" opacity=".7"/><circle cx="46" cy="30" r="7" fill="#6b4c12"/><path d="M28 74C26 50 62 44 66 62C69 76 50 80 46 68" fill="none" stroke="#6b4c12" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="62" r="5" fill="#6b4c12"/></svg>`;
$('#sl').outerHTML=logo(96);setTimeout(()=>$('#splash').classList.add('x'),1300);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2800)}
const closeAll=()=>document.querySelectorAll('.ov').forEach(o=>o.id!=='pin'&&o.classList.remove('on'));
function modal(h){const m=$('#modal');m.innerHTML=`<div class="box">${h}</div>`;m.classList.add('on')}
function ask(t,d){return new Promise(r=>{modal(`<h3>${esc(t)}</h3><input id="mi" inputmode="decimal" value="${d}"><div class="row"><button class="ghost" id="mc">Cancelar</button><button id="mo">Confirmar</button></div>`);$('#mi').focus();$('#mc').onclick=()=>{closeAll();r(null)};$('#mo').onclick=()=>{closeAll();r(parseFloat($('#mi').value.replace(',','.')))}})}
const hp=async(p)=>{try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(uid+p)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of uid+p)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}};
function pinPad(title,cb,cancel){const o=$('#pin');let v='';o.classList.add('on');
 const draw=()=>{o.innerHTML=`<div style="text-align:center">${logo(48)}<h3 style="margin-top:12px">${esc(title)}</h3><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>${cancel?'<button class="lnk" id="pc" style="margin-top:16px">Cancelar</button>':''}</div>`;
  o.querySelectorAll('.pad button').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else v+=k;draw();if(v.length===4){const ok=await cb(v);if(ok){o.classList.remove('on')}else{v='';draw();o.firstChild.classList.add('shake');toast('PIN incorreto')}}});
  if(cancel)$('#pc').onclick=()=>o.classList.remove('on')};draw()}
function gate(){if(pinOpen)return;pinOpen=true;const nw=!me().pin;pinPad(nw?'Crie seu PIN de 4 números':'Digite seu PIN',async p=>{if(nw){const h=await hp(p);await commit(a=>{a.pin=h},1)}else if(await hp(p)!==me().pin)return false;unl=true;pinOpen=false;document.body.classList.remove('lk');return true})}
const confirmPin=cb=>pinPad('Confirme com seu PIN',async p=>{if(await hp(p)===me().pin){cb();return true}return false},true);
async function commit(mut,nh){const a=JSON.parse(JSON.stringify(me()));mut(a);if(!nh)a.hist=(a.hist||[]).concat([+(bal(a)+inv(a)+cxs(a)).toFixed(2)]).slice(-20);const id=a.id;delete a.id;try{await db.doc('accounts/'+id).set(a)}catch(e){toast('Não foi possível salvar.')}}
async function cadastrar(){const n=$('#nome').value.trim(),p=$('#pn').value.trim();if(n.length<3||!/^\d{4}$/.test(p)){toast('Informe o nome e um PIN de 4 números.');return}
 const d=new Date();d.setFullYear(d.getFullYear()+5);
 const a={name:n,cpf:$('#cpf').value.trim(),pin:await hp(p),ag:'0001',cc:rnd(5)+'-'+rnd(1),saldo:1000,hold:{BRHM:0,CAML:0},hist:[1000],fav:[],seen:Date.now(),card:{n1:'37'+rnd(2),n2:rnd(6),n3:rnd(5),val:String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()+0).slice(2),cid:rnd(4),on:true,limite:5000,fatura:0},ext:[{t:'Crédito de boas-vindas',v:1000,ts:Date.now()}]};
 try{await db.doc('accounts/'+uid).set(a);unl=true;document.body.classList.remove('lk');toast('Conta aberta. Bem-vindo(a)!')}catch(e){toast('Erro ao abrir a conta.')}}
function enviarPix(){const v=parseFloat($('#pv').value.replace(',','.')),m=me(),d=accs.find(a=>a.id===pick),msg=$('#pm').value.trim().slice(0,60);
 if(!d||!(v>0)){toast('Escolha o amigo e informe o valor.');return}if(v>bal(m)){toast('Saldo insuficiente.');return}
 confirmPin(async()=>{const ts=Date.now(),code=('E'+ts.toString(36)+uid.slice(0,6)).toUpperCase().slice(0,16);
  try{await db.doc('pix/'+ts+'_'+uid).set({from:uid,to:d.id,fromName:m.name,toName:d.name,v,ts,msg,code});known&&known.add(ts+'_'+uid);
   rcpt=`Comprovante Pix · Mamãe Moeda Bank\nValor: ${brl(v)}\nPara: ${d.name}\nDe: ${m.name}\nData: ${new Date(ts).toLocaleString('pt-BR')}\nAutenticação: ${code}`;
   modal(`<div style="text-align:center">${logo(44)}<h3 style="margin-top:8px">Pix enviado</h3><div class="price pos">${brl(v)}</div></div><div class="item"><span class="sub">Para</span><b>${esc(d.name)}</b></div><div class="item"><span class="sub">De</span><b>${esc(m.name)}</b></div><div class="item"><span class="sub">Data</span><b>${new Date(ts).toLocaleString('pt-BR')}</b></div>${msg?`<div class="item"><span class="sub">Mensagem</span><b>${esc(msg)}</b></div>`:''}<div class="item"><span class="sub">Autenticação</span><b>${code}</b></div><div class="row" style="margin-top:14px"><button class="ghost" onclick="share()">Compartilhar</button><button onclick="closeAll();tab='home';render()">Concluir</button></div>`)}catch(e){toast('Pix não enviado.')}})}
async function share(){try{if(navigator.share)await navigator.share({text:rcpt});else{await navigator.clipboard.writeText(rcpt);toast('Comprovante copiado')}}catch(e){}}
async function emprestimo(){const m=me();if(m.loan){const d=m.loan.dev;if(d>bal(m)){toast('Saldo insuficiente. Você deve '+brl(d)+' à Mamãe.');return}commit(a=>{a.saldo-=d;a.ext.unshift({t:'Pagamento do empréstimo da Mamãe',v:-d,ts:Date.now()});delete a.loan});toast('Empréstimo quitado!');return}const v=await ask('Quanto pedir à Mamãe? Até R$ 2.000, com 5% de juros',500);if(!(v>0))return;if(v>2000){toast('O limite é R$ 2.000.');return}commit(a=>{a.saldo+=v;a.loan={dev:+(v*1.05).toFixed(2),em:Date.now()};a.ext.unshift({t:'Empréstimo da Mamãe (+5% de juros)',v,ts:Date.now()})});toast('Você deve '+brl(v*1.05)+'. Toque em Empréstimo de novo para quitar.')}
